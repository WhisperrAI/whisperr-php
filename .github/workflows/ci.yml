name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '8.0'
            illuminate-version: '^8.83'
            phpunit-version: '^9.6'
          - php-version: '8.1'
            illuminate-version: '^10.0'
            phpunit-version: '^10.5'
          - php-version: '8.2'
            illuminate-version: '^11.0'
            phpunit-version: '^10.5'
          - php-version: '8.3'
            illuminate-version: '^11.0'
            phpunit-version: '^10.5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: WhisperrAI/whisperr-spec
          path: whisperr-spec
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, json, mbstring, dom, xml, xmlwriter
          coverage: none
      - run: >-
          composer require --dev --no-interaction --prefer-dist
          'illuminate/support:${{ matrix.illuminate-version }}'
          'illuminate/container:${{ matrix.illuminate-version }}'
          'illuminate/config:${{ matrix.illuminate-version }}'
          'phpunit/phpunit:${{ matrix.phpunit-version }}'
      - run: vendor/bin/phpunit
        env:
          WHISPERR_SPEC_PATH: ${{ github.workspace }}/whisperr-spec/conformance/wire.json
